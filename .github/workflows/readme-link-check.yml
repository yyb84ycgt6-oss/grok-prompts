name: README Link Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  readme-link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate README links
        run: python scripts/check_readme_links.py
