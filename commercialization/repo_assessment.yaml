    - The repository is a flat collection of public prompt assets and planning artifacts, not an application runtime.
    - The current repository now serves as backup/parallel source material relative to the original Jacky application lineage on 93jessycollin93-del.
    - The current files are useful as reference inputs for a future product, but not as a launch-ready product surface.
