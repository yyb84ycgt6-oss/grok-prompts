      - unverified ownership or redistribution rights for prompt contents
      - use of third-party branding or model references in a commercial product
      - direct public launch without audit trail, rollout controls, or evaluation gates
    medium:
      - duplicated policy text drifting across prompt families
      - template variables lacking a formal runtime schema
      - no structured metadata for prompt assets
    low:
