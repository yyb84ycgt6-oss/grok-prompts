      - good seed asset for a public comparison or explanation feature
      - needs provider abstraction and response evaluations
  - asset_id: doc.readme
    file: /home/runner/work/grok-prompts/grok-prompts/README.md
    family: governance
    role: public_catalog
    format: markdown
    target_surfaces:
      - github
    target_models: []
    template_variables: []
    commercialization_notes:
      - authoritative public asset listing
      - useful as import metadata, not as product logic
canonical_families:
  - family: grok4_chat
    candidates:
      - prompt.grok4.system.v8
      - prompt.grok4p1.thinking.v2
      - prompt.grok4p1.nonthinking.tool
      - prompt.grok4p1.nonthinking.notool
    action: choose one canonical base per runtime mode
  - family: safety_prefixes
    candidates:
      - prompt.grok4.safety
      - prompt.grok4.code_rc1.safety
      - prompt.grok4.mini.system
    action: convert to policy modules with explicit scope and precedence
  - family: feature_prompts
    candidates:
      - prompt.ask_grok.system
      - prompt.grok.analyze_button
    action: keep as separate feature templates with shared metadata schema
