      - should become metadata-backed policy configuration in a product
  - asset_id: prompt.grok4p1.nonthinking.notool
    file: /home/runner/work/grok-prompts/grok-prompts/grok4p1_non_thinking_no_tool_system_turn_prompt.j2
    family: grok4p1
    role: chat_system_prompt
    format: jinja2
