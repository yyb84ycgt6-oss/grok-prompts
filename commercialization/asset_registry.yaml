registry_version: 1
registry_purpose: canonical asset map for import into a future prompt management application
default_policy:
  ownership_status: unverified_public_asset
  launch_disposition: reference_only_until_rights_review
assets:
  - asset_id: prompt.grok4.system.v8
    file: /home/runner/work/grok-prompts/grok-prompts/grok4_system_turn_prompt_v8.j2
    family: grok4
    role: chat_system_prompt
    format: jinja2
    target_surfaces:
      - grok.com
      - x.com
    target_models:
      - Grok 4
    template_variables:
      - is_mobile
      - is_subjective
    commercialization_notes:
      - embedded safety and product guidance
      - requires branding and rights review
  - asset_id: prompt.grok3.official.p1
    file: /home/runner/work/grok-prompts/grok-prompts/grok3_official0330_p1.j2
    family: grok3
    role: chat_system_prompt
    format: jinja2
    target_surfaces:
      - grok.com
      - x.com
    target_models:
      - Grok 3
    template_variables:
      - disable_search
      - enable_memory
      - has_memory_management
      - is_mobile
      - is_vlm
      - dynamic_prompt
      - custom_personality
      - custom_instructions
      - time
      - grok3mini
    commercialization_notes:
      - includes runtime-personality and memory-related branches
      - treat as reference-only until ownership is verified
  - asset_id: prompt.ask_grok.system
    file: /home/runner/work/grok-prompts/grok-prompts/ask_grok_system_prompt.j2
