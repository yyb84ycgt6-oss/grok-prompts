    role: x_bot_prompt
    format: jinja2
    target_surfaces:
      - x.com
    target_models:
      - Grok 4
    template_variables: []
    commercialization_notes:
      - specialized response-style prompt for X
      - useful as a feature-specific prompt pattern
  - asset_id: prompt.grok4.safety
    file: /home/runner/work/grok-prompts/grok-prompts/grok_4_safety_prompt.txt
    family: safety
    role: safety_prefix
    format: text
    target_surfaces:
      - api
    target_models:
      - grok-4-0709
    template_variables: []
    commercialization_notes:
      - standalone safety block
      - duplicate content appears embedded elsewhere
  - asset_id: prompt.grok4.code_rc1.safety
    file: /home/runner/work/grok-prompts/grok-prompts/grok_4_code_rc1_safety_prompt.txt
    family: safety
    role: safety_prefix
    format: text
    target_surfaces:
      - api
    target_models:
      - grok-code-fast-1
    template_variables: []
    commercialization_notes:
      - shorter policy variant
      - drift risk relative to fuller safety variants
  - asset_id: prompt.grok4.mini.system
    file: /home/runner/work/grok-prompts/grok-prompts/grok_4_mini_system_prompt.txt
    family: api
    role: system_prefix
    format: text
    target_surfaces:
      - api
    target_models:
      - grok-4-fast
    template_variables: []
